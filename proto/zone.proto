syntax = "proto3";

package smartboat.zone;

message CoordinatePoint {
  double latitude = 1;
  double longitude = 2;
}

message RestrictedZoneItem {
  int32 id = 1;
  string name = 2;
  string code = 3;
  int32 zone_type = 4;          // 1: Cấm tuyệt đối, 2: Cấm theo mùa, 3: Khu bảo tồn
  int64 valid_from = 5;
  int64 valid_to = 6;
  string description = 7;
  repeated CoordinatePoint polygon = 8;
}

message RestrictedZonesPack {
  string version = 1;
  int64 updated_at = 2;
  repeated RestrictedZoneItem zones = 3;
}
